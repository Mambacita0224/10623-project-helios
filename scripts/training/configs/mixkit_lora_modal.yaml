# Mixkit stage-1 LoRA on Modal (course plan–aligned: early blocks, attn1-only PEFT, early latent loss).
# Latents + checkpoints on volume `helios-mixkit` (mount `/vol`).
#
# PEFT: `lora_rank` 16, `lora_early_attn1_blocks: B` → LoRA on `blocks[0..B-1].attn1` only
# (`to_q`, `to_k`, `to_v`, `to_out.0`); no cross-attn (attn2). Ablate B ∈ {3,5,8}; default 5.
# Training precision: bf16 LoRA (not QLoRA) — state that on the poster if asked.
#
# For a quick smoke: set `max_train_steps: 100`, `checkpointing_steps: 100`, `lr_warmup_steps: 20`.
# After changing B or loss, remove stale `output_dir/config.json` (e.g. `clear_mixkit_train_stale_config`).

output_dir: /vol/mixkit_curated/train_lora
logging_dir: logs
seed: 43

report_to:
  tracker_name: Helios-Mixkit-LoRA
  wandb_name: mixkit_lora
  # Requires Modal secret `wandb` with WANDB_API_KEY (optional: WANDB_ENTITY, WANDB_PROJECT).
  report_to: wandb

data_config:
  use_shuffle: true
  pin_memory: true
  # Safer on serverless workers than persistent_workers + many workers.
  persistent_workers: false
  force_rebuild: true
  single_res: true
  single_height: 384
  single_width: 640
  dataloader_num_workers: 4
  prefetch_factor: 2
  caption_dropout_p: 0
  id_token: ""
  use_stage1_dataset: true
  # Unified long-clip setup: 99 pixel frames per clip for train/eval alignment.
  min_num_frame: 99
  instance_data_root:
    - "/vol/mixkit_curated/latents_pt_99"

model_config:
  # Populated on the models volume by `_ensure_model_downloaded` before training (same as inference).
  pretrained_model_name_or_path: "/root/models/BestWishYsh/Helios-Distilled"
  transformer_model_name_or_path: "/root/models/BestWishYsh/Helios-Distilled"
  load_checkpoints_custom: false
  load_dcp: false
  upcast_vae: true
  enable_slicing: false
  enable_tiling: false
  lora_rank: 16
  lora_alpha: 16.0
  lora_dropout: 0.0
  lora_layers: null
  lora_target_modules: []
  lora_exclude_modules: []
  # Slightly wider LoRA scope helps preserve semantic structure through later frames.
  lora_early_attn1_blocks: 12
  train_norm_layers: false

validation_config:
  # I2V: first frame on disk (relative to training cwd: `/root/helios` in Modal) + motion/descr. prompt.
  # Use any `384x640`-friendly still (Mixkit res); switch to t2v by setting `validation_sample_type: t2v` and removing image fields.
  validation_sample_type: i2v
  validation_image_path: example/wave.jpg
  validation_steps: 1000
  first_step_valid: false
  validation_height: 384
  validation_width: 640
  validation_max_num_frames: 99
  validation_prompts:
    - "A towering emerald wave surges forward, its crest curling with raw power and energy. Sunlight glints off the translucent water, illuminating the intricate textures and deep green hues within the wave's body. Close-up shot with dynamic movement."
  validation_guidance_scale: 5.0
  # 99-frame export with latent chunk size 9.
  validation_latent_window_size:
    - 9
  num_validation_videos: 1
  num_inference_steps: 50
  use_dynamic_shifting: true
  time_shift_type: "exponential"

training_config:
  allow_tf32: false
  gradient_checkpointing: true
  enable_xformers_memory_efficient_attention: false
  enable_npu_flash_attention: false
  upcast_before_saving: false
  offload: false
  mixed_precision: "bf16"
  max_train_steps: 2000
  train_batch_size: 1
  gradient_accumulation_steps: 1
  checkpointing_steps: 200
  resume_from_checkpoint: "latest"
  save_checkpoints_custom: false
  # Lower LR reduces overfitting artifacts and late-frame semantic washout.
  learning_rate: 5e-5
  lr_scheduler: "constant"
  lr_warmup_steps: 200
  optimizer: "adamw"
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 1e-04
  adam_epsilon: 1e-08
  max_grad_norm: 1.0
  weighting_scheme: "logit_normal"
  logit_mean: 0.0
  logit_std: 1.0
  mode_scale: 1.29
  # Keep mild early emphasis without starving late-frame learning.
  use_early_latent_time_loss_weight: true
  early_latent_time_weight_start: 1.6
  early_latent_time_weight_end: 1.1
  use_dynamic_shifting: false
  time_shift_type: "exponential"
  base_seq_len: 256
  max_seq_len: 4096
  base_shift: 0.5
  max_shift: 1.15
  vae_decode_type: "default"
  use_ema: false
  use_ema_validation: false
  ema_decay: 0.999
  ema_start_step: 250
  ema_zero3_port: 10543
  ema_deepspeed_config_file: "scripts/accelerate_configs/zero3.json"
  is_enable_stage1: true
  history_sizes:
    - 16
    - 2
    - 1
  # Long-clip training still uses latent chunk size 9 within each sampled rollout window.
  latent_window_size:
    - 9
  is_random_drop: true
  # I2V-focused curriculum:
  # - high i2v ratio keeps first frame as anchor (history mostly dropped)
  # - low v2v keeps some temporal robustness
  # - zero t2v avoids diluting i2v warm-start learning
  random_drop_i2v_ratio: 0.6
  random_drop_v2v_ratio: 0.2
  random_drop_t2v_ratio: 0.0
  corrupt_model_input: false
  corrupt_mode_model_input: "noise"
  corrupt_mode_prob_model_input: 0.6
  is_frame_independent_corrupt_model_input: true
  is_chunk_independent_corrupt_model_input: false
  noise_corrupt_ratio_model_input: 0.33333333333333
  noise_corrupt_clean_prob_model_input: 0.1
  downsample_min_corrupt_ratio_model_input: 0.9
  downsample_max_corrupt_ratio_model_input: 1.0
  corrupt_history: true
  corrupt_mode_history: "noise"
  corrupt_mode_prob_history: 0.6
  is_frame_independent_corrupt_history: true
  is_chunk_independent_corrupt_history: false
  noise_corrupt_ratio_history_short: 0.33333333333333
  noise_corrupt_ratio_history_mid: 0.33333333333333
  noise_corrupt_ratio_history_long: 0.33333333333333
  noise_corrupt_clean_prob_history: 0.1
  downsample_min_corrupt_ratio_history: 0.9
  downsample_max_corrupt_ratio_history: 1.0
  is_amplify_history: false
  history_scale_mode: "per_head"
  is_train_full_patch_embedding: false
  is_train_lora_patch_embedding: false
  has_multi_term_memory_patch: true
  is_train_full_multi_term_memory_patchg: true
  is_train_lora_multi_term_memory_patchg: false
  zero_history_timestep: true
  guidance_cross_attn: true
  restrict_self_attn: false
  is_train_restrict_lora: false
  restrict_lora: false
  restrict_lora_rank: 128
